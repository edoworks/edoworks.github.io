name: site-claims

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate lifecycle and discovery claims
        run: python3 scripts/check_site_claims.py
      - name: Compare Rung status with Foculoom's public page
        run: python3 scripts/check_cross_domain_status.py
      - name: Validate NowNest light and dark contrast
        run: python3 scripts/check_nownest_contrast.py
      - name: Run claim regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
