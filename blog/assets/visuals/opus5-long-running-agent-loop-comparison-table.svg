<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="426" viewBox="0 0 1200 426">
  <rect x="0" y="0" width="1200" height="426" fill="#FFFFFF"/>
  <rect x="40" y="40" width="216" height="340" fill="#F8FAFC" stroke="#7c3aed" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="40" y="40" width="216" height="60" fill="#7c3aed" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="60" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">What Long-Running</text>
  <text x="60" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">Agents Need</text>
  <rect x="276" y="40" width="216" height="340" fill="#F8FAFC" stroke="#7c3aed" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="276" y="40" width="216" height="60" fill="#7c3aed" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="296" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">How the Loop Maps to</text>
  <text x="296" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">the Agent Loop</text>
  <rect x="512" y="40" width="216" height="340" fill="#F8FAFC" stroke="#7c3aed" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="512" y="40" width="216" height="60" fill="#7c3aed" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="532" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">Why Opus 5 Matters for</text>
  <text x="532" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">Agent Operations</text>
  <rect x="748" y="40" width="216" height="340" fill="#F8FAFC" stroke="#7c3aed" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="748" y="40" width="216" height="60" fill="#7c3aed" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="768" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">The Cost Dimension</text>
  <rect x="984" y="40" width="216" height="340" fill="#F8FAFC" stroke="#7c3aed" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="984" y="40" width="216" height="60" fill="#7c3aed" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="1004" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#7c3aed" font-weight="700">What This Means</text>
  <text x="60" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">A long-running agent is not</text>
  <text x="60" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">just a model with a large</text>
  <text x="60" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">context window.</text>
  <text x="296" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">A plan-build-review-verify</text>
  <text x="296" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">loop maps directly to what a</text>
  <text x="296" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">long-running agent sustains.</text>
  <text x="532" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">How much of the loop an agent</text>
  <text x="532" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">can handle without human</text>
  <text x="532" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">intervention determines how</text>
  <text x="532" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">much leverage a team gets from</text>
  <text x="768" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Long-running agents consume</text>
  <text x="768" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">more tokens than single-turn</text>
  <text x="768" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">prompts.</text>
  <text x="1004" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">The response to Opus 5 is</text>
  <text x="1004" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">operational, not</text>
  <text x="1004" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">architectural.</text>
</svg>